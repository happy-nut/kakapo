\* Four runs in one: both answers to each constant, because both are ordinary.
\*   AutoResolves  TRUE  = a clean worktree with commits ahead (the agent committed and stopped)
\*                 FALSE = a dirty worktree, or nothing ahead and no upstream
\*   MarkUsable    TRUE  = a review has been handed off and the branch has moved past the mark
\*                 FALSE = nothing handed off yet, or the agent rebased the mark off the branch
\* The runner (check.sh) sets these; this file carries the TRUE/TRUE case so the module is runnable
\* on its own from an editor.
SPECIFICATION Spec

CONSTANTS
    AutoResolves = TRUE
    MarkUsable = TRUE
    RestoredTip = FALSE

INVARIANTS
    TypeOK
    MenuTellsTheTruth

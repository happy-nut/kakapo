name: Release

# Push a v* tag (e.g. `npm version patch && git push --follow-tags`) to build the macOS (Apple Silicon)
# .dmg and attach it to a GitHub Release.
# There is no npm publish — the app ships from the GitHub Releases page only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and attach desktop packages to.
        required: true
        type: string

permissions:
  contents: read

# Serialize with the weekly auto-release so a tag never builds the same version twice at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The dmg job creates the release if the tag has none yet, so it needs no job ordered in front of it.
  macos-release:
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ inputs.release_tag }}

name: Release on merge to main

# 개발은 develop에서 하고, main에는 PR 머지로만 들어온다. 그 머지가 곧 릴리스다 — 지난 v* 태그 이후
# 커밋이 있으면 patch(0.0.1)를 올려 태그를 찍고 배포(macOS dmg)까지 한 번에 끝낸다.
# 날짜가 아니라 머지가 릴리스를 끊으므로, 고친 것이 다음 주 일요일까지 사용자에게 안 가는 일이 없다.
# minor/major(예: 0.1.0)는 여전히 사람이 직접 올린다:
#   npm version <minor|major> && git push --follow-tags   (그 태그 push는 release.yml이 처리)
#
# 무한 루프가 없는 이유가 두 겹이다. 이 워크플로우가 main에 push하는 릴리스 커밋은 GITHUB_TOKEN으로
# 나가고, 그 push는 어떤 워크플로우도 트리거하지 않는다. 메시지의 [skip ci]는 그 위에 얹은 안전벨트다.
# 같은 이유로 태그 push가 release.yml을 깨우지 않으므로, 배포는 이 파일이 직접 부른다(아래 jobs).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 릴리스 커밋/태그 push와 GitHub Release 업로드에 contents:write가 필요하다.
permissions:
  contents: write

# 수동 release.yml과 동시에 두 번 배포되지 않도록 직렬화한다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    # 릴리스 커밋 자체로는 절대 다시 돌지 않는다. GITHUB_TOKEN push가 트리거되지 않는다는 사실에만
    # 기대면, 누가 그 커밋을 손으로 다시 push 하는 날 릴리스가 릴리스를 낳는다.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # describe/rev-list가 전체 히스토리와 태그를 봐야 한다

      # 지난 릴리스 태그 이후 변경이 있는지 확인한다. 없으면 이후 스텝을 모두 건너뛴다.
      - name: Detect changes since last release
        id: gate
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "아직 v* 태그가 없습니다 — 첫 릴리스는 수동으로 끊어 주세요. 건너뜁니다."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(git rev-list "$last"..HEAD --count)"
          echo "마지막 릴리스: $last — 이후 커밋 $count개."
          if [ "$count" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing은 npm >= 11.5.1이 필요하다(러너 기본보다 최신).
      - name: Upgrade npm
        if: steps.gate.outputs.go == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: npm ci

      # 핵심 유저 플로우 테스트가 통과해야만 버전업·태그·배포로 넘어간다. 빨간 빌드는 배포되지 않는다.
      - name: Run tests
        if: steps.gate.outputs.go == 'true'
        run: npm test

      - name: Configure git as release bot
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # patch만 올린다(0.0.1). npm version이 커밋 + v* 태그를 만든다. [skip ci]로 불필요한 재실행을 막는다.
      - name: Bump patch version
        id: version
        if: steps.gate.outputs.go == 'true'
        run: |
          npm version patch -m "chore(release): v%s [skip ci]"
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # 커밋을 먼저, 태그를 그 다음에 민다. `git push --follow-tags`는 두 ref를 한 번에 보내지만
      # 원자적이지 않다: 태그가 먼저 올라가고 브랜치가 거부되면, 아무도 가진 적 없는 커밋을 가리키는
      # 태그만 원격에 남는다. 그 고아 태그는 다음 릴리스의 `npm version patch`가 같은 이름을 만들려다
      # 실패하게 해서, 한 번의 경합이 그 뒤의 모든 릴리스를 막는다.
      #
      # 경합 자체는 막을 수 없다. 위의 concurrency group은 릴리스끼리만 직렬화하고, 이 워크플로우를
      # 깨뜨리는 것은 다른 릴리스가 아니라 **릴리스가 도는 동안 들어온 머지**다 — 머지는 릴리스를
      # 기다리지 않는다. 2026-10-25에 세 분 간격의 두 머지가 정확히 이렇게 겹쳤다.
      #
      # 그래서 목표를 "경합을 없앤다"가 아니라 "경합이 다음 릴리스를 막지 못하게 한다"로 둔다.
      # 이 순서에서는 브랜치 push가 거부되면 태그는 아예 만들어지지 않으므로, 실패가 그 실행 하나로
      # 끝나고 사람이 워크플로우를 다시 돌리면 깨끗하게 이어진다.
      - name: Push commit, then tag
        if: steps.gate.outputs.go == 'true'
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

  # A tag pushed with GITHUB_TOKEN does not trigger release.yml, so the dmg build is called here
  # directly. kakapo is macOS-only, so this is the whole of the release.
  macos-release:
    needs: auto-release
    if: needs.auto-release.outputs.release_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ needs.auto-release.outputs.release_tag }}

name: Test

# main/develop push와 모든 PR에서 핵심 유저 플로우 회귀 테스트(test/*.test.mjs)를 돌린다. 개발이
# develop에서 이뤄지므로 그 브랜치도 대상이다 — PR을 열 때까지 아무 신호도 없으면, 하루치 커밋을
# 쌓아두고 나서야 무엇이 깨졌는지 알게 된다. 머지 전에 회귀를 잡는 1차 방어선이며, 배포 경로
# (release.yml / auto-release.yml)는 같은 `npm test`를 배포 직전 게이트로 한 번 더 실행한다.
# 테스트가 무엇을 보장하는지는 test/USER_FLOWS.md 참고.
on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  # GitHub reads the skip marker out of the SQUASHED commit message, and a squash merge collects every
  # commit subject AND body on the branch into it, so a branch carrying a release commit's marker
  # — which is what merging main into a feature branch pulls in — silently stops auto-release.yml
  # from running at all once it lands. The fix lands, no release follows, and nothing reports it.
  no-skip-ci-on-the-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a branch whose commits would mute the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          messages=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json commits \
            --jq '.commits[] | .messageHeadline, .messageBody')
          muted=$(printf '%s\n' "$messages" | grep -iE '\[(skip ci|ci skip)\]' || true)
          if [ -n "$muted" ]; then
            echo "These commits would be collected into the squashed merge message and stop the release:"
            printf '%s\n' "$muted"
            echo
            echo "Rebase the branch onto main instead of merging main into it, or open a fresh branch."
            exit 1
          fi
          echo "no commit on this branch carries a skip-ci marker"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14.0", "24"] # package.json engines: node >=22.14; verify current and next LTS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test`의 pretest가 먼저 빌드(tsc + viewer 에셋 복사)하므로, 실제 배포되는 dist 산출물을
      # 그대로 jsdom에 띄워 검증한다.
      - name: Run tests
        run: npm test
